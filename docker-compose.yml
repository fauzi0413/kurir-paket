version: '3.8'

services:
  # =========================================================================
  # 1. Backend Game Server (Go / Node.js)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kurir_paket_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - CORS_ALLOWED_ORIGINS=*
    networks:
      - game_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # =========================================================================
  # 2. Frontend Web Client (Nginx Alpine + Three.js)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kurir_paket_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - game_network

networks:
  game_network:
    driver: bridge
